name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Normalize Windows temporary path
        shell: pwsh
        run: |
          $nativeTemp = node -e 'process.stdout.write(require("node:fs").realpathSync.native(require("node:os").tmpdir()))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$nativeTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
